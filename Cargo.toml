[workspace]
resolver = "2"
members = [
    "crates/mcclawd-core",
    "crates/mcclawd-agent",
    "crates/mcclawd-tools",
    "crates/mcclawd-channels",
    "crates/mcclawd-channel-telegram",
    "crates/mcclawd-channel-discord",
    "crates/mcclawd-channel-slack",
    "crates/mcclawd-channel-whatsapp",
    "crates/mcclawd-channel-email",
    "crates/mcclawd-tasks",
    "crates/mcclawd-swarm",
    "crates/mcclawd-api",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# LLM layer
rig-core = { version = "0.31", features = ["rmcp"] }

# MCP
rmcp = { version = "0.13", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Config
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# YAML frontmatter (SKILL.md)
gray_matter = "0.3"

# Secrets
aes-gcm-siv = "0.11"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# WebAuthn
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"
url = "2"

# Identity
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Concurrent state
dashmap = "6"

# Async trait
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Futures
futures = "0.3"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Web server
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Telegram
teloxide = { version = "0.13", features = ["macros"] }

# Docker / sandbox
bollard = "0.18"
tar = "0.4"

# Platform dirs
dirs = "6"

# Regex (DLP patterns)
regex = "1"

# Testing
tempfile = "3"

# Internal crates
mcclawd-core = { path = "crates/mcclawd-core" }
mcclawd-agent = { path = "crates/mcclawd-agent" }
mcclawd-tools = { path = "crates/mcclawd-tools" }
mcclawd-channels = { path = "crates/mcclawd-channels" }
mcclawd-tasks = { path = "crates/mcclawd-tasks" }
mcclawd-swarm = { path = "crates/mcclawd-swarm" }
mcclawd-channel-telegram = { path = "crates/mcclawd-channel-telegram" }
mcclawd-channel-discord = { path = "crates/mcclawd-channel-discord" }
mcclawd-channel-slack = { path = "crates/mcclawd-channel-slack" }
mcclawd-channel-email = { path = "crates/mcclawd-channel-email" }
mcclawd-api = { path = "crates/mcclawd-api" }
