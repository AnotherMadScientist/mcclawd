# Development stack — Custom AgentGateway with MCP servers as stdio subprocesses.
# All MCP servers run inside the AgentGateway container (stdio targets).
# Production: mc manages containers directly via bollard (Phase 1+)
services:
  agentgateway:
    build:
      context: ./docker/agentgateway
    ports:
      - "3000:3000"
    volumes:
      - ./config/agentgateway.yaml:/config/agentgateway.yaml:ro
      - mcclawd-data:/data
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped

volumes:
  mcclawd-data:
