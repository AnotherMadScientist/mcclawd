# Development stack — MCP servers + AgentGateway
# Production: mc manages containers directly via bollard (Phase 1+)
services:
  agentgateway:
    image: ghcr.io/modelcontextprotocol/agentgateway:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/agentgateway.yaml:/config/agentgateway.yaml:ro
    depends_on:
      mcp-langextract:
        condition: service_started
      mcp-scrapling:
        condition: service_started
      mcp-filesystem:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mcp-langextract:
    build:
      context: ./docker/mcp-langextract
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-scrapling:
    build:
      context: ./docker/mcp-scrapling
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-filesystem:
    build:
      context: ./docker/mcp-filesystem
    volumes:
      - mcclawd-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mcclawd-data:
