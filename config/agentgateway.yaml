# AgentGateway — multiplexes MCP tool calls via stdio subprocesses.
# Uses stdio targets to avoid HTTP upstream body-read bug in AgentGateway.
#
# Phase 0: This file is static. Phase 1+: generated dynamically from mcp.toml.
binds:
  - port: 3000
    listeners:
      - routes:
          - backends:
              - mcp:
                  targets:
                    - name: langextract
                      stdio:
                        cmd: /usr/local/bin/fastmcp
                        args: ["run", "/opt/langextract-mcp/src/langextract_mcp/server.py"]

                    - name: scrapling
                      stdio:
                        cmd: /usr/local/bin/scrapling-fetch-mcp

                    - name: filesystem
                      stdio:
                        cmd: /usr/bin/mcp-server-filesystem
                        args: ["/data"]
